<body>

<div class="container">

    <div class="card">

        <div class="logo">
            SA
        </div>

        <h1>Smart Lab Attendance</h1>

        <div class="subtitle">
            Administrator Login
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Admin Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                <span id="loginText">LOGIN</span>
                <span class="spinner" id="spinner"></span>
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="security">
            Authorized administrators only.<br>
            Attendance and student data are protected.
        </div>

    </div>

    <div class="footer">
        Image Processing Based Smart Attendance System
    </div>

</div>


<script type="module">

    // ============================================================
    // FIREBASE IMPORTS
    // ============================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        getDatabase,
        ref,
        get
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ============================================================
    // FIREBASE CONFIGURATION
    // ============================================================

    const firebaseConfig = {

        apiKey: "AIzaSyCPixQatVPa326_yGej41aD9p5Z5Fyt3Lg",

        authDomain:
            "kolkata-metro-fine.firebaseapp.com",

        databaseURL:
            "https://kolkata-metro-fine-default-rtdb.firebaseio.com",

        projectId:
            "kolkata-metro-fine",

        storageBucket:
            "kolkata-metro-fine.firebasestorage.app",

        messagingSenderId:
            "835007350697",

        appId:
            "1:835007350697:web:8f359ed3fd8c0805ea66b8"
    };


    // ============================================================
    // YOUR ADMIN UID
    // ============================================================

    const ADMIN_UID =
        "gyXPDTeJARgh1DdLUTO8h2k5Th92";


    // ============================================================
    // INITIALIZE FIREBASE
    // ============================================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getDatabase(app);


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginText =
        document.getElementById("loginText");

    const spinner =
        document.getElementById("spinner");

    const message =
        document.getElementById("message");

    const togglePassword =
        document.getElementById("togglePassword");


    // ============================================================
    // MESSAGE
    // ============================================================

    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    function clearMessage() {

        message.textContent = "";

        message.className = "message";
    }


    // ============================================================
    // LOADING
    // ============================================================

    function setLoading(isLoading) {

        loginBtn.disabled = isLoading;

        if (isLoading) {

            loginText.style.display = "none";

            spinner.style.display = "block";

        } else {

            loginText.style.display = "inline";

            spinner.style.display = "none";
        }
    }


    // ============================================================
    // PASSWORD VISIBILITY
    // ============================================================

    togglePassword.addEventListener(
        "click",
        () => {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type = "text";

                togglePassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "👁";
            }

        }
    );


    // ============================================================
    // CHECK ADMIN
    // ============================================================

    async function verifyAdmin(user) {

        console.log(
            "Authenticated UID:",
            user.uid
        );


        // --------------------------------------------------------
        // SECURITY CHECK
        // --------------------------------------------------------

        if (user.uid !== ADMIN_UID) {

            await signOut(auth);

            throw new Error(
                "This Firebase account is not the configured administrator."
            );
        }


        // --------------------------------------------------------
        // READ ADMIN RECORD
        // --------------------------------------------------------

        const adminRef =
            ref(
                db,
                "admins/" + ADMIN_UID
            );


        const snapshot =
            await get(adminRef);


        if (!snapshot.exists()) {

            throw new Error(
                "Admin database record is missing. Create admins/" +
                ADMIN_UID +
                " in Realtime Database."
            );
        }


        const adminData =
            snapshot.val();


        console.log(
            "Admin database record:",
            adminData
        );


        // --------------------------------------------------------
        // ACTIVE CHECK
        // --------------------------------------------------------

        if (
            adminData.active !== true
        ) {

            throw new Error(
                "Administrator account is disabled."
            );
        }


        // --------------------------------------------------------
        // ROLE CHECK
        // --------------------------------------------------------

        if (
            adminData.role !== "admin"
        ) {

            throw new Error(
                "The Firebase account does not have admin role."
            );
        }


        return true;
    }


    // ============================================================
    // LOGIN
    // ============================================================

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            clearMessage();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter your admin email and password."
                );

                return;
            }


            setLoading(true);


            try {

                // ------------------------------------------------
                // FIREBASE AUTHENTICATION
                // ------------------------------------------------

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                console.log(
                    "Firebase login successful."
                );

                console.log(
                    "User UID:",
                    user.uid
                );


                // ------------------------------------------------
                // ADMIN VERIFICATION
                // ------------------------------------------------

                await verifyAdmin(user);


                // ------------------------------------------------
                // SUCCESS
                // ------------------------------------------------

                showMessage(
                    "Administrator verified. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "classes.html"
                        );

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                let errorMessage =
                    error.message;


                // Firebase errors

                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Incorrect admin email or password.";
                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email address.";
                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "Too many login attempts. Please wait and try again.";
                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "Network error. Check your internet connection.";
                }

                else if (
                    error.code ===
                    "PERMISSION_DENIED"
                ) {

                    errorMessage =
                        "Database permission denied. Check your Firebase Realtime Database rules.";
                }


                showMessage(
                    errorMessage ||
                    "Login failed."
                );


                // Make sure failed authentication
                // does not remain active.

                try {

                    await signOut(auth);

                } catch (signOutError) {

                    console.error(
                        signOutError
                    );
                }


                setLoading(false);
            }

        }
    );


    // ============================================================
    // CHECK EXISTING SESSION
    // ============================================================

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                return;
            }


            try {

                // ------------------------------------------------
                // ONLY YOUR ADMIN UID
                // ------------------------------------------------

                if (
                    user.uid !== ADMIN_UID
                ) {

                    await signOut(auth);

                    return;
                }


                // ------------------------------------------------
                // CHECK DATABASE
                // ------------------------------------------------

                const adminRef =
                    ref(
                        db,
                        "admins/" + ADMIN_UID
                    );


                const snapshot =
                    await get(adminRef);


                if (
                    snapshot.exists()
                    &&
                    snapshot.val().active === true
                    &&
                    snapshot.val().role === "admin"
                ) {

                    console.log(
                        "Existing administrator session found."
                    );


                    window.location.replace(
                        "classes.html"
                    );
                }

            } catch (error) {

                console.error(
                    "Existing session check failed:",
                    error
                );

            }

        }
    );

</script>

</body>
</html>
