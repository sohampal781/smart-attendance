<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Lab Attendance - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
        }

        .box {
            width: 390px;
            max-width: calc(100% - 30px);
            background: #fff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin: 7px 0 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            display: block !important;
            background: #dbeafe;
            color: #1e40af;
        }

        .uid {
            margin-top: 20px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 7px;
            font-size: 10px;
            color: #64748b;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        SA
    </div>

    <h1>Smart Lab Attendance</h1>

    <div class="subtitle">
        Administrator Login
    </div>

    <form id="loginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            id="email"
            type="email"
            value="admin@admin.com"
            placeholder="Admin email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            LOGIN
        </button>

    </form>

    <div id="message"></div>

    <div class="uid">
        Authorized Admin UID:<br>
        gyXPDTeJARgh1DdLUTO8h2k5Th92
    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    // ==========================================================
    // FIREBASE CONFIG
    // ==========================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCPixQatVPa326_yGej41aD9p5Z5Fyt3Lg",

        authDomain:
            "kolkata-metro-fine.firebaseapp.com",

        databaseURL:
            "https://kolkata-metro-fine-default-rtdb.firebaseio.com",

        projectId:
            "kolkata-metro-fine",

        storageBucket:
            "kolkata-metro-fine.firebasestorage.app",

        messagingSenderId:
            "835007350697",

        appId:
            "1:835007350697:web:8f359ed3fd8c0805ea66b8"
    };


    // ==========================================================
    // ADMIN UID
    // ==========================================================

    const ADMIN_UID =
        "gyXPDTeJARgh1DdLUTO8h2k5Th92";


    // ==========================================================
    // INITIALIZE
    // ==========================================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    // ==========================================================
    // ELEMENTS
    // ==========================================================

    const form =
        document.getElementById("loginForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // ==========================================================
    // MESSAGE
    // ==========================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className = type;
    }


    // ==========================================================
    // LOGIN
    // ==========================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            button.disabled = true;

            button.textContent =
                "AUTHENTICATING...";

            message.className = "";

            try {

                // ------------------------------------------------
                // FIREBASE LOGIN
                // ------------------------------------------------

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        email.value.trim(),
                        password.value
                    );


                const user =
                    credential.user;


                console.log(
                    "Firebase UID:",
                    user.uid
                );


                // ------------------------------------------------
                // UID VERIFICATION
                // ------------------------------------------------

                if (
                    user.uid !== ADMIN_UID
                ) {

                    await signOut(auth);

                    throw new Error(
                        "This Firebase account is not the authorized administrator."
                    );
                }


                // ------------------------------------------------
                // LOGIN SUCCESS
                // ------------------------------------------------

                showMessage(
                    "Administrator verified. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "classes.html";

                    },
                    700
                );


            } catch(error) {

                console.error(
                    "Login error:",
                    error
                );


                let text =
                    "Login failed.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    text =
                        "Incorrect email or password.";
                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    text =
                        "Invalid email address.";
                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    text =
                        "Too many attempts. Try again later.";
                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    text =
                        "Network error. Check your internet connection.";
                }

                else if (
                    error.message
                ) {

                    text =
                        error.message;
                }


                showMessage(
                    text,
                    "error"
                );


                button.disabled = false;

                button.textContent =
                    "LOGIN";
            }

        }
    );

</script>

</body>
</html>
```
