
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Lab Attendance - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
        }

        .login-box {
            width: 390px;
            max-width: calc(100% - 30px);
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 18px 0 5px;
            color: #0f172a;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .info {
            display: block !important;
            background: #dbeafe;
            color: #1e40af;
        }

        .uid-box {
            margin-top: 15px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 7px;
            font-size: 11px;
            word-break: break-all;
            color: #475569;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">SA</div>

    <h1>Smart Lab Attendance</h1>

    <div class="subtitle">
        Administrator Login
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="admin@admin.com"
            value="admin@admin.com"
            required
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            required
        >

        <button id="loginButton" type="submit">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

    <div id="uidBox" class="uid-box">
        Expected Admin UID:<br>
        gyXPDTeJARgh1DdLUTO8h2k5Th92
    </div>

</div>


<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        getDatabase,
        ref,
        get
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // =========================================================
    // CONFIG
    // =========================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCPixQatVPa326_yGej41aD9p5Z5Fyt3Lg",

        authDomain:
            "kolkata-metro-fine.firebaseapp.com",

        databaseURL:
            "https://kolkata-metro-fine-default-rtdb.firebaseio.com",

        projectId:
            "kolkata-metro-fine",

        storageBucket:
            "kolkata-metro-fine.firebasestorage.app",

        messagingSenderId:
            "835007350697",

        appId:
            "1:835007350697:web:8f359ed3fd8c0805ea66b8"
    };


    // =========================================================
    // ADMIN UID
    // =========================================================

    const ADMIN_UID =
        "gyXPDTeJARgh1DdLUTO8h2k5Th92";


    // =========================================================
    // INITIALIZE
    // =========================================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getDatabase(app);


    // =========================================================
    // ELEMENTS
    // =========================================================

    const form =
        document.getElementById("loginForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // =========================================================
    // MESSAGE
    // =========================================================

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className = type;
    }


    // =========================================================
    // LOGIN
    // =========================================================

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            message.className = "";

            message.textContent = "";

            button.disabled = true;

            button.textContent =
                "Checking...";


            try {

                // =================================================
                // STEP 1
                // FIREBASE AUTHENTICATION
                // =================================================

                showMessage(
                    "Authenticating...",
                    "info"
                );


                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email.value.trim(),
                        password.value
                    );


                const user =
                    result.user;


                console.log(
                    "LOGIN SUCCESS"
                );

                console.log(
                    "Email:",
                    user.email
                );

                console.log(
                    "UID:",
                    user.uid
                );


                // =================================================
                // STEP 2
                // UID CHECK
                // =================================================

                if (
                    user.uid !== ADMIN_UID
                ) {

                    await signOut(auth);

                    throw new Error(
                        "Wrong Firebase account. Logged-in UID is: " +
                        user.uid +
                        " but expected UID is: " +
                        ADMIN_UID
                    );
                }


                // =================================================
                // STEP 3
                // DATABASE ADMIN RECORD
                // =================================================

                showMessage(
                    "Authentication successful. Checking admin record...",
                    "info"
                );


                const adminReference =
                    ref(
                        db,
                        "admins/" + ADMIN_UID
                    );


                const snapshot =
                    await get(adminReference);


                console.log(
                    "Database path:",
                    "admins/" + ADMIN_UID
                );


                if (!snapshot.exists()) {

                    await signOut(auth);

                    throw new Error(
                        "ADMIN RECORD NOT FOUND.\n\n" +
                        "Create this exact database path:\n\n" +
                        "admins/" +
                        ADMIN_UID
                    );
                }


                const admin =
                    snapshot.val();


                console.log(
                    "Admin data:",
                    admin
                );


                // =================================================
                // STEP 4
                // ACTIVE CHECK
                // =================================================

                if (
                    admin.active !== true
                ) {

                    await signOut(auth);

                    throw new Error(
                        "Admin account exists but active is not true."
                    );
                }


                // =================================================
                // STEP 5
                // ROLE CHECK
                // =================================================

                if (
                    admin.role !== "admin"
                ) {

                    await signOut(auth);

                    throw new Error(
                        "Admin record exists but role is not 'admin'."
                    );
                }


                // =================================================
                // SUCCESS
                // =================================================

                showMessage(
                    "Login successful. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "classes.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                let errorText =
                    error.message ||
                    "Login failed.";


                // Firebase authentication errors

                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorText =
                        "Invalid email or password.";
                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorText =
                        "Invalid email address.";
                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorText =
                        "Too many failed login attempts. Try again later.";
                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorText =
                        "Network error. Check your internet connection.";
                }

                else if (
                    error.code ===
                    "PERMISSION_DENIED"
                ) {

                    errorText =
                        "Realtime Database permission denied.";
                }


                showMessage(
                    errorText,
                    "error"
                );


                button.disabled = false;

                button.textContent =
                    "LOGIN";
            }

        }
    );

</script>

</body>
</html>
```
